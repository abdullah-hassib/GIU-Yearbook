
<!-- FILE: components/header/header.html -->

<header class="header">

  <!-- German tricolor -->
  <div class="tricolor" aria-hidden="true">
    <span class="band band--ink"></span>
    <span class="band band--red"></span>
    <span class="band band--gold"></span>
  </div>

  <div class="header__inner">

    <!-- Logo and university title -->
    <a
      class="brand"
      routerLink="/"
      aria-label="GIU Yearbook, go to home"
    >
      @if (!logoFailed()) {
        <img
          class="brand__logo"
          src="images/giu-logo.png"
          alt="German International University"
          (error)="logoFailed.set(true)"
        />
      } @else {
        <span class="brand__fallback">GIU</span>
      }

      <span class="brand__text">
        <strong>German International University</strong>
        <small>YEARBOOK / 2028</small>
      </span>
    </a>

    <!-- Navigation links -->
    <nav class="nav" aria-label="Main">
      @for (link of navLinks; track link.path) {
        <a
          class="nav__link"
          [routerLink]="link.path"
          routerLinkActive="nav__link--active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Header actions -->
    <div class="header__actions">

      <!-- Saved students counter -->
      <p class="header__saved" aria-live="polite">
        Saved
        <span class="header__count">
          {{ saved.count() }}
        </span>
      </p>

      <!-- Authentication controls -->
      @if (auth.currentUser(); as user) {

        <!-- Signed-in student -->
        <a
          class="btn header__login"
          routerLink="/profile"
        >
          My profile
          <img
            src="icons/arrow-up-right.svg"
            alt=""
            aria-hidden="true"
          />
        </a>

        <button
          type="button"
          class="btn header__login"
          (click)="signOut()"
        >
          Sign out
        </button>

      } @else {

        <!-- Signed-out visitor -->
        <a
          class="btn header__login"
          routerLink="/login"
        >
          Student login
          <img
            src="icons/arrow-up-right.svg"
            alt=""
            aria-hidden="true"
          />
        </a>

      }

    </div>

  </div>

</header>
