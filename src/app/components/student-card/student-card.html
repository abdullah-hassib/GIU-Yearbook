<article class="student-card">
  
<div class="student-card__image">
  <img
    [src]="photoSrc()"
    [alt]="student().name + ' portrait'"
    (error)="onImageError()"
    loading="lazy"
  />

  <button
    type="button"
    class="student-card__save"
    [class.student-card__save--on]="isSaved()"
    [attr.aria-pressed]="isSaved()"
    [attr.aria-label]="'Save ' + student().name"
    (click)="onToggleSaved($event)"
  >
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.6"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    </svg>
  </button>
</div>


  <div class="student-card__content">
    <p class="student-card__faculty">
      {{ student().faculty }}
    </p>

    <h3 class="student-card__name">
      {{ student().name }}
    </h3>

    <p class="student-card__year">
      Class of {{ student().classYear }}
    </p>

    <p class="student-card__quote">
      "{{ student().quote }}"
    </p>

    <a
      class="student-card__link"
      [routerLink]="['/students', student().id]"
    >
      View Profile →
    </a>
  </div>
</article>
